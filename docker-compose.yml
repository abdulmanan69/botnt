services:
  phantom:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # The proxy reaches the container on port 80, so the Coolify domain is just
    # https://your.domain - no port suffix needed.
    expose:
      - "80"
    # ports:
    #   - "8000:80"        # only needed for local testing, Coolify routes internally
    environment:
      PHANTOM_PORT: "80"
      # every value below is optional: empty = generated / auto-detected at boot
      PHANTOM_AUTH: ${PHANTOM_AUTH:-}            # empty -> random password, persisted in /data
      PHANTOM_PSK: ${PHANTOM_PSK:-}              # empty -> random key, persisted in /data
      PHANTOM_PUBLIC_URL: ${PHANTOM_PUBLIC_URL:-}  # empty -> derived from the request host
      PHANTOM_SOCKS: ${PHANTOM_SOCKS:-true}
    volumes:
      - phantom-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  phantom-data:
